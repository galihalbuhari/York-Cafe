<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<link rel="preconnect" href="https://fonts.googleapis.com">

<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --gold: #C8860A;
    --gold-light: #E5A422;
    --gold-pale: #F5D99A;
    --gold-bg: #FDF5E4;
    --dark: #2C1A0E;
    --darker: #1C0A00;
    --bg: #F5F0EB;
    --bg2: #EDE6DC;
    --cream: #FAF6F0;
    --text: #2C1A0E;
    --text2: #6B4C2A;
    --text3: #9E7A52;
    --border: rgba(44,26,14,0.12);
    --border2: rgba(200,134,10,0.25);
    --shadow-sm: 0 2px 12px rgba(44,26,14,0.08);
    --shadow-md: 0 8px 32px rgba(44,26,14,0.12);
    --shadow-lg: 0 20px 60px rgba(44,26,14,0.18);
    --radius-sm: 10px;
    --radius-md: 16px;
    --radius-lg: 24px;
    --radius-xl: 32px;
    --font-serif: 'Noto Serif', serif;
    --font-body: 'Be Vietnam Pro', sans-serif;
  }
  html, body, #root {
    height: 100%;
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  body { overscroll-behavior: none; }
  input, button, textarea { font-family: var(--font-body); }
  * { -webkit-tap-highlight-color: transparent; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
  @keyframes fadeInUp { from { opacity:0; transform:translateY(24px); } to { opacity:1; transform:translateY(0); } }
  @keyframes slideUp { from { transform:translateY(100%); } to { transform:translateY(0); } }
  @keyframes scaleIn { from { opacity:0; transform:scale(0.92); } to { opacity:1; transform:scale(1); } }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.5; } }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes ripple { to { transform:scale(3); opacity:0; } }
  @keyframes shimmer { 0% { background-position:-200% 0; } 100% { background-position:200% 0; } }
  @keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-8px); } }
  @keyframes bounce { 0%,100% { transform:scale(1); } 50% { transform:scale(1.15); } }
  @keyframes badgePop { 0% { transform:scale(0); } 60% { transform:scale(1.2); } 100% { transform:scale(1); } }

  .skeleton {
    background: linear-gradient(90deg, var(--bg2) 25%, var(--bg) 50%, var(--bg2) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    border-radius: var(--radius-sm);
  }
  .scroll-container { overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .scroll-container::-webkit-scrollbar { display: none; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback, createContext, useContext, useMemo } = React;

/* ===================== CONFIG SUPABASE ===================== */
const SUPABASE_URL = 'https://tdumhldxsdxicqflayge.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_WPVYMjtudli5Sgecyaghgg_VoYtE8-8';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ===================== MOCK DATA (saat Supabase belum terhubung) ===================== */
const MOCK_CATEGORIES = [
  { id: 1, name: 'Drinks', slug: 'drinks', icon: '☕' },

  { id:1, category_id:1, name:'York Signature Latte', description:'Espresso premium dengan susu steamed creamy dan sentuhan karamel vanilla. Minuman andalan York yang memanjakan setiap tegukan.', price:48000, image:'https://images.unsplash.com/photo-1541167760496-1628856ab772?w=600&q=80', is_available:true },
  { id:2, category_id:1, name:'Cold Brew Tonic', description:'Cold brew 18 jam dengan tonic water segar dan irisan jeruk lemon. Menyegarkan dengan kompleksitas rasa yang memukau.', price:52000, image:'https://images.unsplash.com/photo-1461023058943-07fcbe16d735?w=600&q=80', is_available:true },
  { id:3, category_id:1, name:'Matcha Oat Latte', description:'Matcha ceremonial grade Jepang dengan oat milk creamy. Harmonisasi rasa earthy dan manis yang sempurna.', price:55000, image:'https://images.unsplash.com/photo-1515823064-d6e0c04616a7?w=600&q=80', is_available:true },
  { id:4, category_id:1, name:'Espresso Tonic', description:'Single origin espresso yang dituang langsung ke tonic water dingin. Bold, bright, dan refreshing dalam satu gelas.', price:45000, image:'https://images.unsplash.com/photo-1510591509098-f4fdc6d0ff04?w=600&q=80', is_available:true },
  { id:5, category_id:1, name:'Classic Cappuccino', description:'Dua shot espresso arabika dengan foam susu silk yang sempurna. Klasik yang tidak pernah salah.', price:42000, image:'https://images.unsplash.com/photo-1534778101976-62847782c213?w=600&q=80', is_available:true },
  { id:6, category_id:1, name:'Butterscotch Frappe', description:'Frappe creamy dengan butterscotch sauce, topped whipped cream dan drizzle karamel premium.', price:58000, image:'https://images.unsplash.com/photo-1572490122747-3e9f9e0aea5f?w=600&q=80', is_available:true },
  { id:7, category_id:2, name:'Croissant Butter', description:'Croissant all-butter tradisional dengan lapisan 72 fold yang menghasilkan tekstur flaky sempurna. Dipanggang fresh setiap pagi.', price:35000, image:'https://images.unsplash.com/photo-1555507036-ab1f4038808a?w=600&q=80', is_available:true },
  { id:8, category_id:2, name:'Smashed Avocado Toast', description:'Sourdough artisan dengan avocado smash, telur poached, feta cheese, micro herbs dan drizzle olive oil premium.', price:75000, image:'https://images.unsplash.com/photo-1603046891740-de0748a4f05b?w=600&q=80', is_available:true },
  { id:9, category_id:2, name:'York Eggs Benedict', description:'English muffin hangat dengan pulled beef brisket, telur poached, dan hollandaise sauce buatan sendiri.', price:95000, image:'https://images.unsplash.com/photo-1608039829572-78524f79c4c7?w=600&q=80', is_available:true },
  { id:10, category_id:2, name:'Banana Walnut Cake', description:'Banana bread lembab dengan walnut crunchy, cream cheese frosting, dan taburan cinnamon sugar. Pair sempurna dengan kopi.', price:42000, image:'https://images.unsplash.com/photo-1621303837174-89787a7d4729?w=600&q=80', is_available:true },
  { id:11, category_id:2, name:'Chicken Truffle Sandwich', description:'Ayam panggang dengan truffle mayo, arugula segar, tomat sun-dried, dan provolone di ciabatta artisan.', price:88000, image:'https://images.unsplash.com/photo-1481070414801-51fd732d7184?w=600&q=80', is_available:true },
  { id:12, category_id:2, name:'Granola Parfait', description:'Granola homemade, Greek yogurt thick, seasonal berries, dan madu wildflower. Sarapan sehat yang memanjakan.', price:62000, image:'https://images.unsplash.com/photo-1511690743698-d9d85f2fbf38?w=600&q=80', is_available:true },
];

/* ===================== CONTEXT ===================== */
const AppContext = createContext(null);
const useApp = () => useContext(AppContext);

/* ===================== FORMAT CURRENCY ===================== */
const fmt = (n) => 'Rp ' + n.toLocaleString('id-ID');

/* ===================== ICON COMPONENTS ===================== */
const Icon = ({ name, size=20, style={} }) => {
  const icons = {
    coffee: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" style={style}><path d="M17 8h1a4 4 0 0 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/><line x1="6" y1="2" x2="6" y2="4"/><line x1="10" y1="2" x2="10" y2="4"/><line x1="14" y1="2" x2="14" y2="4"/></svg>,
    search: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" style={style}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>,
    cart: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" style={style}><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>,

    close: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" style={style}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
    chevLeft: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={style}><polyline points="15 18 9 12 15 6"/></svg>,
    check: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={style}><polyline points="20 6 9 17 4 12"/></svg>,
    time: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" style={style}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
    user: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" style={style}><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>,
    star: <svg width={size} height={size} viewBox="0 0 24 24" fill="currentColor" stroke="none" style={style}><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>,
    bell: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" style={style}><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>,
    note: <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" style={style}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>,

    wave: null,
  };
  return icons[name] || null;
};

/* ===================== LOGO COMPONENT ===================== */
const YorkLogo = ({ size = 'md', dark = false }) => {
  const sizes = { sm: { text: 28, sub: 10 }, md: { text: 42, sub: 12 }, lg: { text: 64, sub: 14 } };
  const s = sizes[size];
  return (
    <div style={{ textAlign: 'center', lineHeight: 1 }}>
      <div style={{
        fontFamily: 'var(--font-serif)',
        fontSize: s.text,
        fontWeight: 600,
        letterSpacing: '0.08em',
        color: dark ? 'var(--gold)' : 'var(--darker)',
        lineHeight: 1,
      }}>YORK</div>
      <div style={{
        fontSize: s.sub,
        letterSpacing: '0.35em',
        color: dark ? 'rgba(200,134,10,0.7)' : 'var(--text3)',
        fontWeight: 500,
        textTransform: 'uppercase',
        marginTop: 4,
      }}>Heritage Coffee</div>
    </div>
  );
};

/* ===================== LOADING SPINNER ===================== */
const Spinner = ({ color = 'var(--gold)' }) => (
  <div style={{
    width: 32, height: 32, borderRadius: '50%',
    border: `3px solid ${color}20`,
    borderTop: `3px solid ${color}`,
    animation: 'spin 0.8s linear infinite',
    margin: '0 auto',
  }} />
);

/* ===================== PAGE: WELCOME ===================== */
const WelcomePage = ({ onStart }) => {
  const [name, setName] = useState('');
  const [focused, setFocused] = useState(false);
  const [loading, setLoading] = useState(false);
  const [mounted, setMounted] = useState(false);
  useEffect(() => { setTimeout(() => setMounted(true), 50); }, []);

  const handleStart = () => {
    if (!name.trim()) return;
    setLoading(true);
    setTimeout(() => onStart(name.trim()), 600);
  };

  return (
    <div style={{
      minHeight: '100vh',
      background: 'var(--darker)',
      display: 'flex',
      flexDirection: 'column',
      alignItems: 'center',
      justifyContent: 'center',
      position: 'relative',
      overflow: 'hidden',
      padding: '2rem',
    }}>
      {/* Background pattern */}
      <div style={{
        position: 'absolute', inset: 0, opacity: 0.04,
        backgroundImage: `radial-gradient(circle at 2px 2px, var(--gold) 1px, transparent 0)`,
        backgroundSize: '32px 32px',
      }} />
      {/* Gold glow orbs */}
      <div style={{ position:'absolute', top:'15%', left:'20%', width:300, height:300, borderRadius:'50%', background:'radial-gradient(circle, rgba(200,134,10,0.15) 0%, transparent 70%)', pointerEvents:'none' }} />
      <div style={{ position:'absolute', bottom:'10%', right:'10%', width:200, height:200, borderRadius:'50%', background:'radial-gradient(circle, rgba(200,134,10,0.1) 0%, transparent 70%)', pointerEvents:'none' }} />

      <div style={{ position:'relative', zIndex:1, width:'100%', maxWidth:400, textAlign:'center' }}>
        {/* Logo area */}
        <div style={{ animation: mounted ? 'fadeInUp 0.7s ease forwards' : 'none', opacity: mounted?1:0 }}>
          {/* Ornamental line */}
          <div style={{ display:'flex', alignItems:'center', gap:12, marginBottom:32, justifyContent:'center' }}>
            <div style={{ flex:1, height:1, background:'linear-gradient(to right, transparent, rgba(200,134,10,0.5))' }} />
            <div style={{ width:6, height:6, borderRadius:'50%', background:'var(--gold)' }} />
            <div style={{ flex:1, height:1, background:'linear-gradient(to left, transparent, rgba(200,134,10,0.5))' }} />
          </div>
          <YorkLogo size="lg" dark={true} />
          <div style={{ display:'flex', alignItems:'center', gap:12, marginTop:32, justifyContent:'center' }}>
            <div style={{ flex:1, height:1, background:'linear-gradient(to right, transparent, rgba(200,134,10,0.5))' }} />
            <div style={{ width:6, height:6, borderRadius:'50%', background:'var(--gold)' }} />
            <div style={{ flex:1, height:1, background:'linear-gradient(to left, transparent, rgba(200,134,10,0.5))' }} />
          </div>
        </div>

        {/* Welcome text */}
        <div style={{ margin:'40px 0 32px', animation: mounted ? 'fadeInUp 0.7s 0.15s ease both' : 'none' }}>
          <p style={{ color:'rgba(245,240,235,0.6)', fontSize:14, letterSpacing:'0.2em', textTransform:'uppercase', marginBottom:12 }}>Selamat Datang</p>
          <h1 style={{ fontFamily:'var(--font-serif)', fontSize:26, color:'var(--bg)', fontWeight:400, lineHeight:1.4 }}>
            Nikmati pengalaman kopi<br />
            <em style={{ color:'var(--gold)' }}>terbaik</em> kami
          </h1>
        </div>

        {/* Input form */}
        <div style={{ animation: mounted ? 'fadeInUp 0.7s 0.3s ease both' : 'none' }}>
          <div style={{
            background:'rgba(245,240,235,0.06)',
            borderRadius:'var(--radius-md)',
            border: `1px solid ${focused ? 'rgba(200,134,10,0.5)' : 'rgba(245,240,235,0.1)'}`,
            padding:'4px 4px 4px 16px',
            display:'flex',
            alignItems:'center',
            gap:8,
            marginBottom:16,
            transition:'border-color 0.2s',
          }}>
            <Icon name="user" size={18} style={{ color:'var(--gold)', flexShrink:0 }} />
            <input
              value={name}
              onChange={e => setName(e.target.value)}
              onFocus={() => setFocused(true)}
              onBlur={() => setFocused(false)}
              onKeyDown={e => e.key === 'Enter' && handleStart()}
              placeholder="Masukkan nama Anda..."
              style={{
                flex:1, background:'transparent', border:'none', outline:'none',
                fontSize:15, color:'var(--bg)', padding:'12px 0',
              }}
            />
          </div>

          <button
            onClick={handleStart}
            disabled={!name.trim() || loading}
            style={{
              width:'100%', padding:'16px', borderRadius:'var(--radius-sm)',
              background: name.trim() ? 'var(--gold)' : 'rgba(200,134,10,0.3)',
              color: name.trim() ? 'var(--darker)' : 'rgba(200,134,10,0.5)',
              border:'none', cursor: name.trim() ? 'pointer' : 'not-allowed',
              fontSize:15, fontWeight:600, letterSpacing:'0.05em',
              transition:'all 0.25s', fontFamily:'var(--font-body)',
              display:'flex', alignItems:'center', justifyContent:'center', gap:8,
            }}
          >
            {loading ? <Spinner color="var(--darker)" /> : '✦ Mulai Pesan'}
          </button>
        </div>

        {/* Footer */}
        <div style={{ marginTop:48, animation: mounted ? 'fadeInUp 0.7s 0.45s ease both' : 'none' }}>
          <p style={{ color:'rgba(245,240,235,0.25)', fontSize:12, letterSpacing:'0.1em' }}>
            York Heritage Coffee © 2024
          </p>
        </div>
      </div>
    </div>
  );
};

/* ===================== MENU CARD ===================== */
const MenuCard = ({ item, onAdd, onDetail }) => {
  const [adding, setAdding] = useState(false);
  const handleAdd = (e) => {
    e.stopPropagation();
    setAdding(true);
    onAdd(item);
    setTimeout(() => setAdding(false), 500);
  };
  return (
    <div
      onClick={() => onDetail(item)}
      style={{
        background:'var(--cream)',
        borderRadius:'var(--radius-md)',
        overflow:'hidden',
        boxShadow:'var(--shadow-sm)',
        border:'1px solid var(--border)',
        cursor:'pointer',
        transition:'transform 0.2s, box-shadow 0.2s',
        position:'relative',
      }}
      onMouseEnter={e => { e.currentTarget.style.transform='translateY(-2px)'; e.currentTarget.style.boxShadow='var(--shadow-md)'; }}
      onMouseLeave={e => { e.currentTarget.style.transform='translateY(0)'; e.currentTarget.style.boxShadow='var(--shadow-sm)'; }}
    >
      {/* Image */}
      <div style={{ position:'relative', paddingBottom:'65%', overflow:'hidden' }}>
        <img src={item.image} alt={item.name}
          style={{ position:'absolute', inset:0, width:'100%', height:'100%', objectFit:'cover', transition:'transform 0.4s' }}
          onError={e => { e.target.src='https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=400&q=80'; }}
        />
        <div style={{ position:'absolute', inset:0, background:'linear-gradient(to top, rgba(28,10,0,0.4) 0%, transparent 60%)' }} />
      </div>
      {/* Info */}
      <div style={{ padding:'12px 12px 10px' }}>
        <p style={{ fontSize:13, fontWeight:600, color:'var(--text)', lineHeight:1.3, marginBottom:4 }}>{item.name}</p>
        <p style={{ fontSize:11, color:'var(--text3)', lineHeight:1.4, marginBottom:10, display:'-webkit-box', WebkitLineClamp:2, WebkitBoxOrient:'vertical', overflow:'hidden' }}>{item.description}</p>
        <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between' }}>
          <span style={{ fontSize:14, fontWeight:700, color:'var(--gold)' }}>{fmt(item.price)}</span>
          <button
            onClick={handleAdd}
            style={{
              width:30, height:30, borderRadius:'50%', border:'none',
              background: adding ? 'var(--dark)' : 'var(--gold)',
              color:'white', cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center',
              transition:'all 0.2s', flexShrink:0,
              transform: adding ? 'scale(0.9)' : 'scale(1)',
            }}
          >
            {adding ? <Icon name="check" size={14} /> : <Icon name="plus" size={14} />}
          </button>
        </div>
      </div>
    </div>
  );
};

/* ===================== MENU DETAIL MODAL ===================== */
const MenuDetail = ({ item, onClose, onAdd }) => {
  const [qty, setQty] = useState(1);
  const [note, setNote] = useState('');
  const [adding, setAdding] = useState(false);

  const handleAdd = () => {
    setAdding(true);
    onAdd(item, qty, note);
    setTimeout(() => { setAdding(false); onClose(); }, 500);
  };

  return (
    <div style={{
      position:'fixed', inset:0, zIndex:200,

/* ===================== PAGE: MENU HOME ===================== */
const MenuPage = ({ customerName, cart, onAddToCart, onOpenCart }) => {
  const { categories, menus, loading } = useApp();
  const [activeCategory, setActiveCategory] = useState(null);
  const [search, setSearch] = useState('');
  const [detailItem, setDetailItem] = useState(null);
  const [cartPulse, setCartPulse] = useState(false);
  const prevCartCount = useRef(cart.reduce((s,i)=>s+i.qty,0));

  const cartCount = cart.reduce((s,i)=>s+i.qty,0);
  useEffect(() => {
    if (cartCount > prevCartCount.current) {
      setCartPulse(true);
      setTimeout(() => setCartPulse(false), 400);
    }
    prevCartCount.current = cartCount;
  }, [cartCount]);

  useEffect(() => {
    if (categories.length > 0 && activeCategory === null) {
      setActiveCategory(categories[0].id);
    }
  }, [categories]);

  const filteredMenus = useMemo(() => {
    let items = menus;
    if (activeCategory) items = items.filter(m => m.category_id === activeCategory);
    if (search.trim()) items = items.filter(m => m.name.toLowerCase().includes(search.toLowerCase()));
    return items;
  }, [menus, activeCategory, search]);

  const handleAdd = (item, qty=1, note='') => {
    onAddToCart(item, qty, note);
  };

    <div style={{ display:'flex', flexDirection:'column', height:'100vh', background:'var(--bg)', maxWidth:480, margin:'0 auto', position:'relative' }}>

          <YorkLogo size="sm" dark={true} />
          <div style={{ textAlign:'right' }}>
            <p style={{ fontSize:11, color:'rgba(245,240,235,0.45)', letterSpacing:'0.1em' }}>PEMESANAN</p>

        </div>

        {/* Search */}
        <div style={{
          display:'flex', alignItems:'center', gap:10,
          background:'rgba(245,240,235,0.08)', borderRadius:'var(--radius-sm)',
          padding:'10px 14px', border:'1px solid rgba(245,240,235,0.1)',
          marginBottom:16,
        }}>
          <Icon name="search" size={16} style={{ color:'rgba(245,240,235,0.4)' }} />
          <input

            onChange={e => setSearch(e.target.value)}

            style={{ flex:1, background:'transparent', border:'none', outline:'none', fontSize:14, color:'var(--bg)' }}

            categories.map(cat => (

        boxShadow:'0 -4px 20px rgba(44,26,14,0.08)',

          { icon:'home', label:'Menu', active:true },

          <button key={item.label} onClick={item.onClick} style={{
            background:'none', border:'none', cursor:'pointer', padding:'4px 24px',

/* ===================== PAGE: WAITING ===================== */
const WaitingPage = ({ order, customerName, onNewOrder }) => {
  const [status, setStatus] = useState(order?.status || 'pending');
  const [animPhase, setAnimPhase] = useState(0);

  // Realtime subscription
  useEffect(() => {
    if (!order?.id) return;
    const channel = supabase
      .channel('order-status')
      .on('postgres_changes', {
        event:'UPDATE', schema:'public', table:'orders',
        filter:`id=eq.${order.id}`,
      }, payload => {
        setStatus(payload.new.status);
      })
      .subscribe();
    return () => { supabase.removeChannel(channel); };
  }, [order?.id]);

  useEffect(() => {
    const t = setInterval(() => setAnimPhase(p => (p+1)%4), 600);
    return () => clearInterval(t);
  }, []);

  const steps = [
    { key:'pending', label:'Pesanan Diterima', desc:'Pesanan Anda telah masuk ke sistem kasir', icon:'✓' },
    { key:'processing', label:'Sedang Diproses', desc:'Barista sedang menyiapkan pesanan Anda', icon:'⚡' },
    { key:'done', label:'Pesanan Selesai', desc:'Pesanan siap! Silakan ambil di kasir', icon:'★' },
  ];
  const statusOrder = ['pending','processing','done'];
  const currentIdx = statusOrder.indexOf(status);
  const isDone = status === 'done';

  return (
    <div style={{
      minHeight:'100vh', background:'var(--darker)', display:'flex', flexDirection:'column',
      alignItems:'center', justifyContent:'center', padding:'32px 24px',
      maxWidth:480, margin:'0 auto', position:'relative', overflow:'hidden',
    }}>
      <div style={{ position:'absolute', inset:0, opacity:0.03, backgroundImage:`radial-gradient(circle at 2px 2px, var(--gold) 1px, transparent 0)`, backgroundSize:'32px 32px' }} />

      <div style={{ position:'relative', zIndex:1, width:'100%', textAlign:'center' }}>
        <YorkLogo size="md" dark={true} />
        <div style={{ height:1, background:'linear-gradient(to right, transparent, rgba(200,134,10,0.3), transparent)', margin:'24px 0' }} />

        {/* Main icon animation */}
        <div style={{
          width:100, height:100, borderRadius:'50%', margin:'0 auto 24px',
          background: isDone ? 'var(--gold)' : 'rgba(200,134,10,0.15)',
          border:`3px solid ${isDone ? 'var(--gold)' : 'rgba(200,134,10,0.3)'}`,
          display:'flex', alignItems:'center', justifyContent:'center',
          animation: isDone ? 'none' : 'float 2s ease infinite',
          transition:'all 0.5s',
          boxShadow: isDone ? '0 0 40px rgba(200,134,10,0.4)' : 'none',
        }}>
          {isDone ? (
            <Icon name="check" size={40} style={{ color:'var(--darker)' }} />
          ) : (
            <div style={{ display:'flex', gap:4 }}>
              {[0,1,2].map(i => (
                <div key={i} style={{
                  width:8, height:8, borderRadius:'50%', background:'var(--gold)',
                  animation:`pulse 1.2s ${i*0.2}s ease infinite`,
                  opacity: animPhase === i || animPhase === i+1 ? 1 : 0.3,
                }} />
              ))}
            </div>
          )}
        </div>

        <p style={{ color:'rgba(245,240,235,0.5)', fontSize:12, letterSpacing:'0.2em', textTransform:'uppercase', marginBottom:8 }}>
          {isDone ? 'SIAP DIAMBIL' : 'MENUNGGU'}
        </p>
        <h2 style={{ fontFamily:'var(--font-serif)', fontSize:24, color:'var(--bg)', fontWeight:400, marginBottom:4 }}>
          {isDone ? 'Pesanan Siap! 🎉' : 'Pesanan Sedang Diproses'}
        </h2>
        <p style={{ fontSize:14, color:'rgba(245,240,235,0.45)', marginBottom:32 }}>
          Halo, {customerName}!
        </p>

        {/* Order ID */}
        {order?.id && (
          <div style={{ background:'rgba(245,240,235,0.06)', borderRadius:'var(--radius-sm)', padding:'8px 16px', display:'inline-block', marginBottom:32, border:'1px solid rgba(245,240,235,0.1)' }}>
            <span style={{ fontSize:12, color:'rgba(245,240,235,0.4)', letterSpacing:'0.1em' }}>ORDER #</span>
            <span style={{ fontSize:13, fontWeight:700, color:'var(--gold)', marginLeft:8 }}>{String(order.id).slice(-6).toUpperCase()}</span>
          </div>
        )}

        {/* Steps */}
        <div style={{ width:'100%', marginBottom:32 }}>
          {steps.map((step, i) => {
            const done = i <= currentIdx;
            const active = i === currentIdx;
            return (
              <div key={step.key} style={{ display:'flex', gap:16, marginBottom:i < steps.length-1 ? 0 : 0 }}>
                <div style={{ display:'flex', flexDirection:'column', alignItems:'center' }}>
                  <div style={{
                    width:36, height:36, borderRadius:'50%', flexShrink:0,
                    background: done ? 'var(--gold)' : 'rgba(245,240,235,0.08)',
                    border: `2px solid ${done ? 'var(--gold)' : 'rgba(245,240,235,0.15)'}`,
                    display:'flex', alignItems:'center', justifyContent:'center',
                    transition:'all 0.5s',
                    boxShadow: active && !isDone ? '0 0 20px rgba(200,134,10,0.4)' : 'none',
                  }}>
                    <span style={{ fontSize:14, color: done ? 'var(--darker)' : 'rgba(245,240,235,0.3)' }}>{step.icon}</span>
                  </div>
                  {i < steps.length-1 && (
                    <div style={{ width:2, flex:1, minHeight:20, background: i < currentIdx ? 'var(--gold)' : 'rgba(245,240,235,0.1)', transition:'background 0.5s', margin:'4px 0' }} />
                  )}
                </div>
                <div style={{ paddingTop:6, paddingBottom:i < steps.length-1 ? 16 : 0, textAlign:'left' }}>
                  <p style={{ fontSize:14, fontWeight:600, color: done ? 'var(--bg)' : 'rgba(245,240,235,0.3)', transition:'color 0.5s' }}>{step.label}</p>
                  <p style={{ fontSize:12, color: done ? 'rgba(245,240,235,0.5)' : 'rgba(245,240,235,0.2)', transition:'color 0.5s' }}>{step.desc}</p>
                </div>
              </div>
            );
          })}
        </div>

        {isDone && (
          <button onClick={onNewOrder} style={{
            width:'100%', padding:'16px', borderRadius:'var(--radius-sm)',
            background:'var(--gold)', color:'var(--darker)', border:'none',
            fontSize:15, fontWeight:700, cursor:'pointer', fontFamily:'var(--font-body)',
            animation:'scaleIn 0.4s ease',
          }}>
            ✦ Pesan Lagi
          </button>
        )}

        <p style={{ marginTop:24, fontSize:12, color:'rgba(245,240,235,0.2)' }}>Status diperbarui secara realtime</p>
      </div>
    </div>
  );
};

/* ===================== MAIN APP ===================== */
const App = () => {
  const [page, setPage] = useState('welcome');
  const [customerName, setCustomerName] = useState('');
  const [cart, setCart] = useState([]);
  const [categories, setCategories] = useState([]);
  const [menus, setMenus] = useState([]);
  const [loading, setLoading] = useState(false);
  const [submitting, setSubmitting] = useState(false);
  const [currentOrder, setCurrentOrder] = useState(null);
  const [error, setError] = useState(null);
  const cartIdRef = useRef(0);

  // Load data from Supabase or fallback to mock
  useEffect(() => {
    const loadData = async () => {
      setLoading(true);
      try {
        const { data: cats } = await supabase.from('categories').select('*').order('id');
        const { data: items } = await supabase.from('menus').select('*').eq('is_available', true).order('id');
        if (cats?.length) setCategories(cats);
        else setCategories(MOCK_CATEGORIES);
        if (items?.length) setMenus(items);
        else setMenus(MOCK_MENUS);
      } catch {
        setCategories(MOCK_CATEGORIES);
        setMenus(MOCK_MENUS);
      } finally {
        setLoading(false);
      }
    };
    loadData();
  }, []);

  const handleStart = (name) => {
    setCustomerName(name);
    setPage('menu');
  };

  const handleAddToCart = (item, qty=1, note='') => {
    setCart(prev => {
      const existing = prev.find(i => i.id === item.id && i.note === note);
      if (existing) return prev.map(i => i.cartId === existing.cartId ? {...i, qty: i.qty+qty} : i);
      cartIdRef.current++;
      return [...prev, { ...item, qty, note, cartId: cartIdRef.current }];
    });
  };

  const handleUpdateQty = (cartId, qty) => {
    if (qty < 1) { handleRemove(cartId); return; }
    setCart(prev => prev.map(i => i.cartId === cartId ? {...i, qty} : i));
  };

  const handleRemove = (cartId) => {
    setCart(prev => prev.filter(i => i.cartId !== cartId));
  };

  const handleSubmitOrder = async () => {
    setSubmitting(true);
    try {
      let orderId = Date.now();
      let orderData = { id: orderId, status: 'pending', customer_name: customerName };

      // Try Supabase
      try {
        const { data: order, error: oErr } = await supabase
          .from('orders')
          .insert({ customer_name: customerName, status: 'pending', total: cart.reduce((s,i)=>s+i.price*i.qty,0) })
          .select().single();
        if (!oErr && order) {
          orderData = order;
          await supabase.from('order_items').insert(
            cart.map(i => ({ order_id: order.id, menu_id: i.id, name: i.name, price: i.price, qty: i.qty, note: i.note }))
          );
        }
      } catch {}

      setCurrentOrder(orderData);
      setCart([]);
      setPage('waiting');
    } catch (e) {
      setError('Gagal mengirim pesanan. Coba lagi.');
    } finally {
      setSubmitting(false);
    }
  };

  const contextValue = { categories, menus, loading };

  return (
    <AppContext.Provider value={contextValue}>
      <div style={{ height:'100vh', overflow:'hidden', position:'relative' }}>
        {page === 'welcome' && <WelcomePage onStart={handleStart} />}
        {page === 'menu' && (
          <MenuPage
            customerName={customerName}
            cart={cart}
            onAddToCart={handleAddToCart}
            onOpenCart={() => setPage('cart')}
          />
        )}
        {page === 'cart' && (
          <CartPage
            cart={cart}
            onUpdateQty={handleUpdateQty}
            onRemove={handleRemove}
            onCheckout={() => setPage('checkout')}
            onBack={() => setPage('menu')}
          />
        )}
        {page === 'checkout' && (
          <CheckoutPage
            cart={cart}
            customerName={customerName}
            onBack={() => setPage('cart')}
            onSubmit={handleSubmitOrder}
            loading={submitting}
          />
        )}
        {page === 'waiting' && (
          <WaitingPage
            order={currentOrder}
            customerName={customerName}
            onNewOrder={() => { setPage('menu'); setCurrentOrder(null); }}
          />
        )}

        {/* Error toast */}
        {error && (
          <div style={{
            position:'fixed', bottom:100, left:20, right:20, zIndex:999,
            background:'#B91C1C', color:'white', borderRadius:'var(--radius-sm)',
            padding:'12px 16px', fontSize:14, fontWeight:500,
            display:'flex', alignItems:'center', justifyContent:'space-between',
            animation:'fadeIn 0.3s ease', boxShadow:'var(--shadow-md)',
          }}>
            <span>{error}</span>
            <button onClick={() => setError(null)} style={{ background:'none', border:'none', color:'white', cursor:'pointer', padding:4 }}>
              <Icon name="close" size={16} />
            </button>
          </div>
        )}
      </div>
    </AppContext.Provider>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
